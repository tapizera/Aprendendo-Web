<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  
  <meta name="description" content="Check Point: loja virtual de games, consoles e acessórios.">
  <title>Cadastrar produto | Check Point</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/estilo.css">
</head>
<body>
  <a class="pular" href="#conteudo">Ir para o conteúdo</a>
  <header class="topo">
    <a class="logo" href="index.html">Check Point</a>
    <nav aria-label="Menu principal">
      <ul>
        <li><a href="index.html">Início</a></li>
        <li><a href="sobre.html">Sobre</a></li>
        <li><a href="produtos.html">Produtos</a></li>
        <li><a href="contato.html">Contato</a></li>
        <li><a href="cadastro.html" aria-current="page">Cadastrar produto</a></li>
      </ul>
    </nav>
  </header>

  <main id="conteudo">
    <h1>Cadastrar produto</h1>
    <form id="form-produto" aria-label="Cadastro de produto">
      <div class="erros" id="erros-produto" role="alert" hidden></div>
      <div class="sucesso" id="ok-produto" role="status" hidden></div>
      <fieldset>
        <legend>Dados do produto</legend>
        <div class="campo">
          <label for="nome">Nome</label>
          <input type="text" id="nome" name="nome" required minlength="3" maxlength="60">
        </div>
        <div class="campo">
          <label for="preco">Preço (R$)</label>
          <input type="number" id="preco" name="preco" required min="0.01" step="0.01" inputmode="decimal">
        </div>
        <div class="campo">
          <label for="categoria">Categoria</label>
          <select id="categoria" name="categoria" required>
            <option value="">Escolha uma categoria</option>
            <option value="Consoles">Consoles</option>
            <option value="Jogos">Jogos</option>
            <option value="Acessórios">Acessórios</option>
          </select>
        </div>
        <div class="campo">
          <label for="imagem">Endereço da imagem (opcional)</label>
          <input type="url" id="imagem" name="imagem" placeholder="https://...">
          <p class="dica">Sem imagem, usamos uma ilustração padrão.</p>
        </div>
        <div class="campo">
          <label for="descricao">Descrição</label>
          <textarea id="descricao" name="descricao" required minlength="10" maxlength="200"></textarea>
        </div>
      </fieldset>
      <button type="submit" class="btn coral">Cadastrar produto</button>
    </form>

    <section aria-labelledby="t-lista" style="margin-top:2.2rem">
      <h2 id="t-lista">Produtos cadastrados</h2>
      <div class="grade" id="lista-cadastrados"></div>
    </section>
    <dialog id="detalhes" aria-labelledby="det-titulo">
      <article>
        <img id="det-img" src="img/novo.svg" alt="">
        <h2 id="det-titulo"></h2>
        <p id="det-cat"></p>
        <p id="det-desc"></p>
        <p><strong id="det-preco"></strong></p>
        <button type="button" class="btn" id="det-fechar">Fechar</button>
      </article>
    </dialog>
  </main>

  <footer>
    <p>© 2026 Check Point · Projeto Integrador de Desenvolvimento Web · Estácio</p>
  </footer>
  <script src="js/produtos.js"></script>
  <script src="js/formularios.js"></script>
</body>
</html>
