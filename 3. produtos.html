<!DOCTYPE html>
<html lang="en">
    
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Produtos</title>
    <link rel="stylesheet" href="3. style.css">
</head>

<body>

    <header class="topo">
        <h1 class="topo">Café da Serra</h1>
        <p class="topo_apoio">Torrefação artesanal</p>  
    </header>

    <main>
        <section class="secao">
            <h2>Nossos Cafés</h2>
            <ul class="produtos"> <!-- ul "afasta" -->
                <li class="produto"> <!-- li cria a "bolinha" -->

                    <div class="produto__body">
                        <h3 class="produto__nome">Bourbon Amarelo</h3>
                        <p class="produto__texto">Encorpado, com chocolate amargo no final.</p>
                        <p class="produto__preco">R$ 42,90</p>
                        <button type="button" class="botao">Adicionar ao carrinho</button>
                        </h3>
                    </div>
                </li>

                <li class="produto">
                    <div class="produto__corpo">
                        <h3 class="produto__nome">Café Gourmet</h3>
                        <p class="produto__descricao">Um café encorpado com notas de chocolate.</p>
                        <p class="produto__preco">R$ 25,00</p>
                         <button type="button" class="produto__botao">Comprar</button>
                    </div>
                </li>

            </ul>
        </section>
    </main>
    
</body>

</html>
